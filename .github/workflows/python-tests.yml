name: CI - Unit Tests and Coverage

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Justificación teórica: Una matriz permite paralelizar trabajos. 
    # GitHub levantará 3 contenedores distintos al mismo tiempo, 
    # cada uno con una versión diferente de Python.
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10"]

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          # Instalamos pytest (framework de pruebas) y pytest-cov (reporte de cobertura)
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ejecutar pruebas y generar reporte de cobertura
        run: |
          pytest --cov=./ --cov-report=xml
